name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest + coverage)
        run: pytest --cov=flight_emissions --cov-report=term-missing --cov-fail-under=70

      - name: Smoke-run the pipeline on the bundled sample
        run: python -m flight_emissions run --input data/sample --out results/ --no-figures
